<svg width="180" height="60" viewBox="0 0 180 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Degradado de la gota -->
    <linearGradient id="dropGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>

    <!-- Glow exterior -->
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(79,195,247,0.7)" />
      <stop offset="100%" stop-color="rgba(79,195,247,0)" />
    </radialGradient>
  </defs>

  <!-- Glow animado -->
  <circle cx="30" cy="30" r="26" fill="url(#outerGlow)" opacity="0.25">
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- Gota exterior -->
  <path
    d="M30 6C30 6 12 28 12 42C12 52 20 59 30 59C40 59 48 52 48 42C48 28 30 6 30 6Z"
    fill="url(#dropGradient)"
  >
    <!-- Ondita suave de la gota -->
    <animate attributeName="d"
      dur="4s"
      repeatCount="indefinite"
      values="
        M30 6C30 6 12 28 12 42C12 52 20 59 30 59C40 59 48 52 48 42C48 28 30 6 30 6Z;
        M30 5C30 5 14 29 14 42C14 53 21 60 30 60C39 60 46 53 46 42C46 29 30 5 30 5Z;
        M30 6C30 6 12 28 12 42C12 52 20 59 30 59C40 59 48 52 48 42C48 28 30 6 30 6Z
      "
    />
  </path>

  <!-- Pozo / cilindro -->
  <rect x="21" y="30" width="18" height="14" rx="3" fill="white" opacity="0.95">
    <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite" />
  </rect>
  <rect x="23.5" y="32.5" width="13" height="9" rx="2" fill="#0288D1" opacity="0.95" />

  <!-- Llama / gota interna -->
  <path
    d="M30 19C27 23 26 26 26 28.5C26 31.5 27.8 33.5 30 33.5C32.2 33.5 34 31.5 34 28.5C34 26 33 23 30 19Z"
    fill="white"
  >
    <animate attributeName="d"
      dur="3s"
      repeatCount="indefinite"
      values="
        M30 19C27 23 26 26 26 28.5C26 31.5 27.8 33.5 30 33.5C32.2 33.5 34 31.5 34 28.5C34 26 33 23 30 19Z;
        M30 18C27.2 22.2 26 25 26 28C26 31.2 27.8 33.8 30 33.8C32.2 33.8 34 31.2 34 28C34 25 32.8 22.2 30 18Z;
        M30 19C27 23 26 26 26 28.5C26 31.5 27.8 33.5 30 33.5C32.2 33.5 34 31.5 34 28.5C34 26 33 23 30 19Z
      "
    />
  </path>

  <!-- Texto HydroWells -->
  <text x="60" y="26" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="16" font-weight="600" fill="#E5F3FF" letter-spacing="0.18em">
    HYDROWELLS
  </text>
  <text x="60" y="42" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="12" fill="#9CA3AF">
    Water solutions for Maryland &amp; DC
  </text>
</svg>
